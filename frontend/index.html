<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>snip. — URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0a;
      --surface:  #111111;
      --border:   #222222;
      --accent:   #c8f04a;
      --accent2:  #4af0c8;
      --text:     #e8e8e8;
      --muted:    #555555;
      --error:    #f04a4a;
      --radius:   4px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow-x: hidden;
    }

    /* ── Grid background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,240,74,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,240,74,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Glow blob ── */
    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,240,74,0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeDown 0.6s ease both;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
    }

    .logo span {
      color: var(--accent);
    }

    .tagline {
      margin-top: 0.75rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 620px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      animation: fadeUp 0.6s ease 0.15s both;
    }

    .input-label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    input[type="url"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.875rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]::placeholder { color: var(--muted); }

    input[type="url"]:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #0a0a0a;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.75rem 1.5rem;
      transition: opacity 0.15s, transform 0.15s;
      white-space: nowrap;
    }

    button:hover { opacity: 0.88; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── Result ── */
    .result {
      margin-top: 1.5rem;
      display: none;
      animation: fadeUp 0.3s ease both;
    }

    .result.visible { display: block; }

    .result-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .result-box {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
    }

    .result-url {
      flex: 1;
      font-size: 0.875rem;
      color: var(--accent);
      word-break: break-all;
      text-decoration: none;
    }

    .result-url:hover { text-decoration: underline; }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      font-weight: 400;
      padding: 0.4rem 0.8rem;
      flex-shrink: 0;
    }

    .copy-btn:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
    .copy-btn.copied { border-color: var(--accent2); color: var(--accent2); }

    /* ── Error ── */
    .error-msg {
      display: none;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--error);
    }

    .error-msg.visible { display: block; }

    /* ── Divider ── */
    .divider {
      margin: 1.5rem 0;
      border: none;
      border-top: 1px solid var(--border);
    }

    /* ── History ── */
    .history-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.78rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      animation: fadeUp 0.2s ease both;
    }

    .history-original {
      flex: 1;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-short {
      color: var(--accent);
      text-decoration: none;
      flex-shrink: 0;
    }

    .history-short:hover { text-decoration: underline; }

    .empty-history {
      font-size: 0.78rem;
      color: var(--muted);
      font-style: italic;
    }

    /* ── Footer ── */
    footer {
      margin-top: 2rem;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-align: center;
      animation: fadeUp 0.6s ease 0.3s both;
    }

    footer a { color: var(--muted); text-decoration: underline; }
    footer a:hover { color: var(--accent); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #0a0a0a;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }

    /* ── Animations ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Scrollbar ── */
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="logo">snip<span>.</span></div>
      <p class="tagline">Serverless URL Shortener · Built on AWS</p>
    </header>

    <div class="card">
      <label class="input-label" for="urlInput">Paste your long URL</label>
      <div class="input-row">
        <input
          type="url"
          id="urlInput"
          placeholder="https://example.com/very/long/url/that/nobody/wants/to/type"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="shortenBtn" onclick="shorten()">Snip it</button>
      </div>
      <p class="error-msg" id="errorMsg"></p>

      <div class="result" id="result">
        <p class="result-label">Your short URL</p>
        <div class="result-box">
          <a class="result-url" id="resultUrl" href="#" target="_blank" rel="noopener"></a>
          <button class="copy-btn" id="copyBtn" onclick="copyUrl()">Copy</button>
        </div>
      </div>

      <hr class="divider" />

      <p class="history-label">Session history</p>
      <div class="history-list" id="historyList">
        <p class="empty-history">No links shortened yet.</p>
      </div>
    </div>

    <footer>
      Built by <a href="https://github.com/yousef-usama" target="_blank" rel="noopener">Yousef Osama</a>
      &nbsp;·&nbsp;
      Lambda · API Gateway · DynamoDB · S3 · CloudFront · Terraform
    </footer>
  </div>

  <script>
    // ── Replace this with your actual API Gateway URL after deploying ──
    const API_URL = 'REPLACE_WITH_YOUR_API_URL';

    const history = [];

    async function shorten() {
      const input     = document.getElementById('urlInput');
      const btn       = document.getElementById('shortenBtn');
      const result    = document.getElementById('result');
      const resultUrl = document.getElementById('resultUrl');
      const errorMsg  = document.getElementById('errorMsg');

      const url = input.value.trim();

      // Reset state
      result.classList.remove('visible');
      errorMsg.classList.remove('visible');

      if (!url) {
        showError('Please enter a URL.');
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        showError('URL must start with http:// or https://');
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const response = await fetch(`${API_URL}/shorten`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Something went wrong. Please try again.');
          return;
        }

        // Show result
        resultUrl.textContent = data.short_url;
        resultUrl.href = data.short_url;
        result.classList.add('visible');

        // Reset copy button
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('copied');

        // Add to history
        addToHistory(url, data.short_url);

        // Clear input
        input.value = '';

      } catch (err) {
        showError('Network error — is the API deployed?');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Snip it';
      }
    }

    function showError(msg) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function copyUrl() {
      const url    = document.getElementById('resultUrl').textContent;
      const btn    = document.getElementById('copyBtn');
      navigator.clipboard.writeText(url).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    function addToHistory(original, shortened) {
      history.unshift({ original, shortened });
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (history.length === 0) {
        list.innerHTML = '<p class="empty-history">No links shortened yet.</p>';
        return;
      }
      list.innerHTML = history.map(item => `
        <div class="history-item">
          <span class="history-original" title="${item.original}">${item.original}</span>
          <a class="history-short" href="${item.shortened}" target="_blank" rel="noopener">
            ${item.shortened.split('/').pop()}
          </a>
        </div>
      `).join('');
    }

    // Allow Enter key to trigger shortening
    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') shorten();
    });
  </script>
</body>
</html>
